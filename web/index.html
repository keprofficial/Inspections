<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KEPR inspections — flat, society, and individual home safety inspections.">

  <!--
    Required for a phone browser. Without it mobile browsers assume a 980px
    layout viewport and render the whole app zoomed out.
    `user-scalable` is deliberately NOT disabled so pinch-zoom still works.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F85F5A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KEPR Inspections">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KEPR Inspections</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Guards against closing the tab mid-inspection. Dart sets this flag via
    // `window.keprHasUnsavedWork` whenever an inspection has unsaved changes.
    window.keprHasUnsavedWork = false;
    window.addEventListener('beforeunload', function (event) {
      if (!window.keprHasUnsavedWork) return undefined;
      event.preventDefault();
      // Browsers show their own generic wording; a non-empty value is what
      // actually triggers the prompt.
      event.returnValue = '';
      return '';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
